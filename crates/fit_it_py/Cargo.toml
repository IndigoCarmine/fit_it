[package]
name = "fit_it_py"
version = "0.1.0"
edition = "2024"
description = "Embedded-Python bridge for fit_it, loaded at runtime by the app"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# abi3: one build works with any CPython >= 3.9 on Windows (python3.dll).
pyo3 = { version = "0.26", features = ["abi3-py39"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
